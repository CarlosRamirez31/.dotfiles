; ZProger Build top menu, ported to AwesomeWM's EWMH workspaces.
[global/wm]
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/top]
monitor = ${env:MONITOR:Virtual-1}
width = 98%
height = ${env:POLYBAR_HEIGHT:30}
dpi = 96
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-size = ${env:POLYBAR_BORDER:7}
border-bottom-size = ${env:POLYBAR_BORDER:7}
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = ${env:POLYBAR_LINE:3}
; Keep the normal workarea below the panel while it is visible. Polybar updates
; this reservation automatically when its IPC hide/show commands are used.
enable-struts = true
enable-ipc = true

modules-left = filesystem round-left xworkspaces round-right space htb
modules-center = temperature space space memory space space cpu
modules-right = battery backlight microphone alsa xkeyboard round-left time round-right space bluetooth bluetooth-gap wlan network-gap powermenu tray

font-0 = ${env:POLYBAR_FONT_0:JetBrainsMono Nerd Font:style=Bold:size=12.5;3}
font-1 = ${env:POLYBAR_FONT_1:JetBrainsMono Nerd Font:size=19;5}
; Powerline semicircles fill the module height and align to the shared baseline.
font-2 = ${env:POLYBAR_FONT_2:Iosevka Nerd Font:style=Regular:size=17;4}
font-3 = ${env:POLYBAR_FONT_3:Iosevka Nerd Font:size=13:antialias=true;}

; Small charging bolt shown before the original battery icon.
font-4 = ${env:POLYBAR_FONT_4:JetBrainsMono Nerd Font:style=Bold:size=9;2}
; Bluetooth gets a slightly larger glyph without enlarging the other modules.
font-5 = ${env:POLYBAR_FONT_5:JetBrainsMono Nerd Font:style=Bold:size=15;3}

; X11 permits only one system tray owner per session.
[bar/secondary]
inherit = bar/top
modules-right = battery backlight microphone alsa xkeyboard round-left time round-right space bluetooth bluetooth-gap wlan network-gap powermenu
