$font_family = JetBrainsMono Nerd Font
$accent = rgb(7aa2f7)
$text = rgb(c0caf5)
$muted = rgb(565f89)
$surface = rgba(1a1b26dd)

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 1.05
    brightness = 0.72
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 76
    font_family = $font_family
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $muted
    font_size = 18
    font_family = $font_family
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $text
    font_size = 18
    font_family = $font_family
    position = 0, -65
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    fade_on_empty = false
    placeholder_text = <span foreground="##565f89">Contraseña…</span>
    hide_input = false
    check_color = rgb(e0af68)
    fail_color = rgb(f7768e)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(e0af68)
    rounding = 16
    position = 0, -125
    halign = center
    valign = center
}
