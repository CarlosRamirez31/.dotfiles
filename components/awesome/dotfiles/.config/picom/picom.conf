backend = "glx";
vsync = true;
use-damage = true;
corner-radius = 11;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.30;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'" ];
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-delta = 8;
blur-method = "none";
unredir-if-possible = false;
