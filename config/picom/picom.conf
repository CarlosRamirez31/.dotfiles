backend = "glx";
vsync = true;
use-damage = true;
corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.22;
shadow-offset-x = 0;
shadow-offset-y = 5;
shadow-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'" ];
fading = true;
fade-in-step = 0.10;
fade-out-step = 0.10;
fade-delta = 8;
blur-method = "none";
unredir-if-possible = false;
