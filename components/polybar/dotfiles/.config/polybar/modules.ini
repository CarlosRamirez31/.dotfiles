[module/round-left]
type = custom/text
content = %{T3} %{T-}
content-foreground = #2b2f37

[module/round-right]
type = custom/text
content = %{T3}%{T-}
content-foreground = #2b2f37

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature%
label-warn = %temperature%
ramp-0 = ""
ramp-foreground = #a4ebf3

[module/xworkspaces]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --workspaces "$MONITOR"
interval = 0.3
format = <label>
format-background = #2b2f37
label = %output%

[module/htb]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-htb
interval = 5
format = <label>
label = %output%
format-padding = 0

[module/microphone]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --microphone status
interval = 2
format = <label>
label = %output%
format-padding = 1
click-left = ~/.local/bin/dotfiles-polybar --microphone menu
click-right = ~/.local/bin/dotfiles-polybar --microphone toggle

[module/alsa]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --volume status
interval = 1
format = <label>
format-padding = 1
label = %output%
scroll-up = ~/.local/bin/dotfiles-polybar --volume up
scroll-down = ~/.local/bin/dotfiles-polybar --volume down
click-left = ~/.local/bin/dotfiles-polybar --volume mute

[module/time]
type = internal/date
interval = 60
format = <label>
format-background = #2b2f37
date = %{F#888e96}  %I:%M %p%{F-}
time-alt = %{F#61afef}  %a, %d %b %Y%{F-}
label = %date%%time%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-padding = 1
format-foreground = #d19a66
label = %gb_used%

[module/filesystem]
type = custom/text
content = " "
content-padding = 1
click-left = rofi -show drun
content-foreground = #61afef

[module/wlan]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-wifi --status
interval = 3
format = <label>
label = %output%
click-left = ~/.local/bin/dotfiles-polybar-wifi

[module/battery]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-battery
interval = 5
format = <label>
label = %output%
click-left = ~/.local/bin/dotfiles-polybar-energy

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-bluetooth --status
interval = 5
format = <label>
format-padding = 1
label = %{T6}%output%%{T-}
click-left = ~/.local/bin/dotfiles-polybar-bluetooth
click-right = ~/.local/bin/dotfiles-polybar-bluetooth --toggle

[module/backlight]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --brightness status
interval = 1
scroll-up = ~/.local/bin/dotfiles-polybar --brightness up
scroll-down = ~/.local/bin/dotfiles-polybar --brightness down
format = <label>
format-prefix = "  "
format-prefix-foreground = #61afef
format-padding = 1

[module/powermenu]
type = custom/text
content = " "
content-padding = 1
click-left = ~/.local/bin/dotfiles-polybar-power
content-foreground = #d35f5e

[module/tray]
type = internal/tray
format-margin = 5px
tray-spacing = 5px

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format = <label>
label = %percentage%%
format-foreground = #989cff

[module/space]
type = custom/text
content = " "

[module/xkeyboard]
type = internal/xkeyboard
click-left = ~/.local/bin/dotfiles-keyboard-toggle
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
label-layout-padding = 1
label-layout-foreground = #fff
label-indicator-on = %name%
label-indicator-on-capslock = !
label-indicator-off-capslock =

[module/network-gap]
type = custom/text
content = "  "

[module/bluetooth-gap]
type = custom/text
content = " "
