[module/round-left]
type = custom/text
content = %{T3} %{T-}
content-foreground = #2b2f37

[module/round-right]
type = custom/text
content = %{T3}%{T-}
content-foreground = #2b2f37

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70
format = <ramp> <label>
format-warn = <ramp> <label-warn>
label = %temperature%
label-warn = %temperature%
ramp-0 = ""
ramp-foreground = #a4ebf3

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
icon-0 = 1;%{F#f9de8f}1%{F-}
icon-1 = 2;%{F#ff9b93}2%{F-}
icon-2 = 3;%{F#95e1d3}3%{F-}
icon-3 = 4;%{F#81a1c1}4%{F-}
icon-4 = 5;%{F#a3be8c}5%{F-}
icon-5 = 6;%{F#f9de8f}6%{F-}
icon-6 = 7;%{F#ff9b93}7%{F-}
icon-7 = 8;%{F#95e1d3}8%{F-}
icon-8 = 9;%{F#81a1c1}9%{F-}
label-active = %icon%
label-active-underline = #565c64
label-active-padding = 1
label-active-background = #2b2f37
label-occupied = %icon%
label-occupied-background = #2b2f37
label-occupied-padding = 1
label-empty = %icon%
label-empty-background = #2b2f37
label-empty-padding = 1
label-urgent = %icon%!
label-urgent-background = #2b2f37
label-urgent-padding = 1

[module/htb]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-htb
interval = 5
format = <label>
label = %output%
format-padding = 0

[module/alsa]
type = internal/alsa
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
format-muted = 󰖁
format-muted-padding = 1
label-volume = %percentage%%
ramp-volume-0 = %{F#d35f5e}󰖀 %{F-}
ramp-volume-1 = %{F#d35f5e}󰖀 %{F-}
ramp-volume-2 = %{F#d35f5e}󰖀 %{F-}
ramp-volume-3 = %{F#d35f5e}󰖀 %{F-}
ramp-volume-4 = %{F#d35f5e}󰖀 %{F-}
ramp-volume-5 = %{F#d35f5e}󰕾 %{F-}
ramp-volume-6 = %{F#d35f5e}󰕾 %{F-}
ramp-volume-7 = %{F#d35f5e}󰕾 %{F-}
ramp-volume-8 = %{F#d35f5e}󰕾 %{F-}
ramp-volume-9 = %{F#d35f5e}󰕾 %{F-}

[module/time]
type = internal/date
interval = 60
format = <label>
format-background = #2b2f37
date = %{F#888e96}  %I:%M %p%{F-}
time-alt = %{F#61afef}  %a, %d %b %Y%{F-}
label = %date%%time%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-padding = 1
format-foreground = #d19a66
label = %gb_used%

[module/filesystem]
type = custom/text
content = " "
content-padding = 1
click-left = rofi -show drun
content-foreground = #61afef

[module/wlan]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-wifi --status
interval = 3
format = <label>
label = %output%
click-left = ~/.local/bin/dotfiles-polybar-wifi

[module/battery]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-battery
interval = 30
format = <label>
label = %output%

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT_CARD:intel_backlight}
use-actual-brightness = true
enable-scroll = true
scroll-interval = 5
format = <label>
format-prefix = "  "
format-prefix-foreground = #61afef
format-padding = 1

[module/powermenu]
type = custom/text
content = " "
content-padding = 1
click-left = ~/.local/bin/dotfiles-polybar-power
content-foreground = #d35f5e

[module/tray]
type = internal/tray
format-margin = 5px
tray-spacing = 5px

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format = <label>
label = %percentage%%
format-foreground = #989cff

[module/space]
type = custom/text
content = " "

[module/xkeyboard]
type = internal/xkeyboard
click-left = ~/.local/bin/dotfiles-keyboard-toggle
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
label-layout-padding = 1
label-layout-foreground = #fff
label-indicator-on = %name%
label-indicator-on-capslock = !
label-indicator-off-capslock =
