[mgr]
ratio = [ 1, 3, 4 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5

[preview]
wrap = "yes"
tab_size = 2
max_width = 1200
max_height = 900
image_delay = 40

[plugin]
prepend_preloaders = [
    { mime = "image/*", run = "noop" },
]
prepend_previewers = [
    { mime = "image/*", run = "noop" },
]

[tasks]
micro_workers = 5
macro_workers = 10
image_alloc = 268435456
