[[mgr.prepend_keymap]]
on = "<Enter>"
run = "enter"
desc = "Entrar al directorio"

[[mgr.prepend_keymap]]
on = "<S-Enter>"
run = "open"
desc = "Abrir o confirmar el archivo"

[[mgr.prepend_keymap]]
on = [ "g", "d" ]
run = "cd ~/Downloads"
desc = "Ir a Descargas"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = "cd ~/Pictures"
desc = "Ir a Imágenes"

[[mgr.prepend_keymap]]
on = [ "g", "h" ]
run = "cd ~"
desc = "Ir al inicio"
