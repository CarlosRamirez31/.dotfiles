#!/usr/bin/nft -f
# Managed by the dotfiles security component.

flush ruleset

table inet dotfiles_filter {
    # Lab ports are intentionally ephemeral: open them for a test and they
    # close again after reboot or a firewall reload.
    set lab_tcp_ports {
        type inet_service
        flags interval
    }

    set lab_udp_ports {
        type inet_service
        flags interval
    }

    chain input {
        type filter hook input priority filter
        policy drop

        ct state invalid drop
        ct state established,related accept
        iifname "lo" accept

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # DHCP and DNS for guests on libvirt's default NAT bridge only.
        iifname "virbr0" udp sport 68 udp dport 67 accept
        iifname "virbr0" ip saddr 192.168.122.0/24 udp dport 53 accept
        iifname "virbr0" ip saddr 192.168.122.0/24 tcp dport 53 accept

        # A listener needed for an authorized lab is never exposed directly
        # on Wi-Fi/Ethernet. HTB and similar OpenVPN profiles use tun devices.
        iifname "tun*" tcp dport @lab_tcp_ports accept
        iifname "tun*" udp dport @lab_udp_ports accept
    }

    # Some upstream networks deliver replies with TTL 1. After reverse NAT,
    # allow the final hop to a guest, only for replies to its own connections.
    chain vm_reply_ttl {
        type filter hook prerouting priority -90
        policy accept

        iifname != "virbr0" ip daddr 192.168.122.0/24 ct status snat ct direction reply ip ttl 1 counter ip ttl set 2
    }

    chain forward {
        type filter hook forward priority filter
        policy accept
    }

    chain output {
        type filter hook output priority filter
        policy accept
    }
}
