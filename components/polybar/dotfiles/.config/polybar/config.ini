; ZProger Build top menu, ported to AwesomeWM's EWMH workspaces.
[global/wm]
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini

[bar/top]
monitor = ${env:MONITOR:Virtual-1}
width = 98%
height = 30
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-size = 7
border-bottom-size = 7
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 3
; Keep the normal workarea below the panel while it is visible. Polybar updates
; this reservation automatically when its IPC hide/show commands are used.
enable-struts = true
enable-ipc = true

modules-left = filesystem round-left xworkspaces round-right space htb
modules-center = temperature space space memory space space cpu
modules-right = battery backlight alsa xkeyboard round-left time round-right space wlan network-gap powermenu tray

font-0 = JetBrainsMono Nerd Font:style=Bold:size=12.5;3
font-1 = JetBrainsMono Nerd Font:size=19;5
font-2 = Material Design Icons:style=Bold:size=13;3
font-3 = unifont:fontformat=truetype:size=13:antialias=true;

; Small charging bolt shown before the original battery icon.
font-4 = JetBrainsMono Nerd Font:style=Bold:size=9;2

; X11 permits only one system tray owner per session.
[bar/secondary]
inherit = bar/top
modules-right = battery backlight alsa xkeyboard round-left time round-right space wlan network-gap powermenu
