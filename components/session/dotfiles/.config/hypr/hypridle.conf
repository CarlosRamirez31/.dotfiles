general {
    lock_cmd = dotfiles-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/dotfiles-idle-brightness dim
    on-resume = $HOME/.local/bin/dotfiles-idle-brightness restore
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = $HOME/.local/bin/dotfiles-can-suspend && systemctl suspend
}
