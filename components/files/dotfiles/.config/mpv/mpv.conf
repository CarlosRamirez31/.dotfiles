# VMware sessions export LIBGL_ALWAYS_SOFTWARE=1. MPV 0.41 otherwise probes
# Vulkan, rejects llvmpipe, then can abort while falling back from Wayland to
# X11. Wayland SHM is MPV's native software-scaling output and plays smoothly
# without that GPU probing; physical machines keep automatic GPU selection.
[software-renderer]
profile-cond=os.getenv("LIBGL_ALWAYS_SOFTWARE") == "1"
vo=wlshm
zimg-scaler=bilinear
zimg-dither=no
