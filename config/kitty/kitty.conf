# Match the existing previous terminal appearance and shared Zsh setup.
shell /usr/bin/zsh --login
font_family JetBrainsMono Nerd Font
bold_font JetBrainsMonoNF-Bold
italic_font JetBrainsMonoNF-Italic
bold_italic_font JetBrainsMonoNF-BoldItalic
# previous terminal uses 10 pt with a 1.5 window scale here: match its 12 x 27 px cells.
font_size 15.0

hide_window_decorations yes
background_opacity 0.98
# previous terminal's 12 px padding is also scaled by 1.5: 18 px = 13.5 pt at 96 DPI.
window_padding_width 13.5
placement_strategy center

# Soft cursor blink and a short trail on cursor jumps.
cursor_shape beam
shell_integration no-cursor
cursor_blink_interval 0.5 ease-in-out
cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2

copy_on_select clipboard
# Match previous terminal's default history and mouse-wheel scrolling.
scrollback_lines 10000
scrollbar never
wheel_scroll_multiplier 3
cursor_stop_blinking_after 5

# Preserve the sequences handled by ~/.config/zsh/keybindings.zsh.
map ctrl+backspace send_text all \x17
map shift+left send_text all \x1b[1;2D
map shift+right send_text all \x1b[1;2C
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C
map ctrl+shift+f12 launch --type=os-window --cwd=current

# Catppuccin Mocha, matching previous terminal.
background #1e1e2e
foreground #cdd6f4
cursor #f5e0dc
cursor_text_color #1e1e2e
selection_background #585b70
selection_foreground #cdd6f4

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #89dceb
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #89dceb
color15 #a6adc8
