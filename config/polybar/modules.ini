[module/round-left]
type = custom/text
format = %{T3} %{T-}
format-foreground = ${colors.surface}

[module/round-right]
type = custom/text
format = %{T3}%{T-}
format-foreground = ${colors.surface}

[module/temperature]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --cpu-temperature
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.cyan}
label = %output%

[module/xworkspaces]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --workspaces "$MONITOR"
tail = true
format = <label>
format-background = ${colors.surface}
label = %output%

[module/htb]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-htb
interval = 5
format = <label>
label = %output%
format-padding = 0

[module/microphone]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --microphone watch
tail = true
interval-fail = 5
format = <label>
label = %output%
format-padding = 1
click-left = ~/.local/bin/dotfiles-polybar --microphone menu
click-right = ~/.local/bin/dotfiles-polybar --microphone toggle

[module/alsa]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --volume status
interval = 1
format = <label>
format-padding = 1
label = %output%
scroll-up = ~/.local/bin/dotfiles-polybar --volume up
scroll-down = ~/.local/bin/dotfiles-polybar --volume down
click-left = ~/.local/bin/dotfiles-polybar --volume mute

[module/time]
type = internal/date
interval = 60
format = <label>
format-background = ${colors.surface}
date = %{F#a6adc8}  %I:%M %p%{F-}
time-alt = %{F#89b4fa}  %a, %d %b %Y%{F-}
label = %date%%time%

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-padding = 1
format-foreground = ${colors.peach}
label = %gb_used%

[module/filesystem]
type = custom/text
format = " "
format-padding = 1
click-left = ~/.local/bin/dotfiles-polybar-dashboard
click-right = rofi -show drun
format-foreground = ${colors.blue}

[module/music]
type = custom/text
format = "%{T8}󰎆%{T-}"
format-padding = 1
format-foreground = ${colors.lavender}
click-left = ~/.local/bin/dotfiles-polybar-music

[module/wlan]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-wifi --status
interval = 3
format = <label>
label = %output%
click-left = ~/.local/bin/dotfiles-polybar-wifi

[module/battery]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-battery
interval = 5
format = <label>
format-padding = 1
label = %output%
click-left = ~/.local/bin/dotfiles-polybar-energy

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar-bluetooth --status
interval = 5
format = <label>
format-padding = 1
label = %{T6}%output%%{T-}
click-left = ~/.local/bin/dotfiles-polybar-bluetooth
click-right = ~/.local/bin/dotfiles-polybar-bluetooth --toggle

[module/backlight]
type = custom/script
exec = ~/.local/bin/dotfiles-polybar --brightness status
interval = 1
scroll-up = ~/.local/bin/dotfiles-polybar --brightness up
scroll-down = ~/.local/bin/dotfiles-polybar --brightness down
format = <label>
; A small pixel offset keeps the glyph close to its value without two full cells.
format-prefix = "%{O8}"
format-prefix-foreground = ${colors.blue}
format-padding = 1

[module/powermenu]
type = custom/text
format = " "
format-padding = 1
click-left = ~/.local/bin/dotfiles-polybar-power
format-foreground = ${colors.red}

[module/tray]
type = internal/tray
format-margin = 5px
tray-spacing = 5px

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format = <label>
label = %percentage%%
format-foreground = ${colors.lavender}

[module/space]
type = custom/text
format = " "

[module/xkeyboard]
type = internal/xkeyboard
click-left = ~/.local/bin/dotfiles-keyboard-toggle
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
label-layout-padding = 1
label-layout-foreground = ${colors.foreground}
label-indicator-on = %name%
label-indicator-on-capslock = !
label-indicator-off-capslock =

[module/network-gap]
type = custom/text
format = "  "

[module/bluetooth-gap]
type = custom/text
format = " "
