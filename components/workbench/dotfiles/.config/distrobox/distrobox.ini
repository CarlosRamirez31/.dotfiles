# Declarative Distrobox profiles managed by these dotfiles.

[dev]
image=docker.io/library/archlinux:latest
pull=true
root=false
replace=false
start_now=false
entry=true
additional_packages="base-devel git neovim ripgrep fd fzf nodejs npm python python-pip"
additional_packages="zsh starship fastfetch eza bat zoxide vivid"
additional_packages="zsh-autosuggestions zsh-syntax-highlighting zsh-completions zsh-history-substring-search"
additional_packages="jq yq lazygit lazydocker tree-sitter-cli xclip"

[kalilinux]
image=docker.io/kalilinux/kali-rolling:latest
pull=true
root=false
replace=false
start_now=true
entry=true
pre_init_hooks="mkdir -p /etc/tmpfiles.d; ln -sfn /dev/null /etc/tmpfiles.d/tmp.conf; ln -sfn /dev/null /etc/tmpfiles.d/x11.conf;"
additional_packages="zsh starship fastfetch eza fzf zoxide vivid bat ripgrep fd-find"
additional_packages="zsh-autosuggestions zsh-syntax-highlighting"
additional_packages="git curl wget unzip zip make gcc cmake nodejs npm"
additional_packages="python3 python3-pip python3-venv neovim tree-sitter-cli"
additional_packages="xclip jq lazygit"
additional_packages="nmap ffuf gobuster feroxbuster sqlmap nikto whatweb"
additional_packages="netcat-openbsd socat bind9-dnsutils whois"
additional_packages="smbclient enum4linux-ng seclists wordlists"
init_hooks="command -v fd >/dev/null 2>&1 || ln -sfn /usr/bin/fdfind /usr/local/bin/fd;"
init_hooks="command -v bat >/dev/null 2>&1 || ln -sfn /usr/bin/batcat /usr/local/bin/bat;"
init_hooks="runuser -u \${container_user_name} -- env HOME=\${container_user_home} CONTAINER_ID=kalilinux \${container_user_home}/.local/libexec/dotfiles-distrobox-bootstrap;"

[parrotos]
image=docker.io/parrotsec/security:latest
pull=true
root=false
replace=false
start_now=true
entry=true
pre_init_hooks="mkdir -p /etc/tmpfiles.d; ln -sfn /dev/null /etc/tmpfiles.d/tmp.conf; ln -sfn /dev/null /etc/tmpfiles.d/x11.conf;"
additional_packages="zsh starship fastfetch eza fzf zoxide vivid bat ripgrep fd-find"
additional_packages="zsh-autosuggestions zsh-syntax-highlighting"
additional_packages="git curl wget unzip zip make gcc cmake nodejs npm"
additional_packages="python3 python3-pip python3-venv neovim tree-sitter-cli"
additional_packages="xclip jq lazygit"
init_hooks="command -v fd >/dev/null 2>&1 || ln -sfn /usr/bin/fdfind /usr/local/bin/fd;"
init_hooks="command -v bat >/dev/null 2>&1 || ln -sfn /usr/bin/batcat /usr/local/bin/bat;"
init_hooks="runuser -u \${container_user_name} -- env HOME=\${container_user_home} CONTAINER_ID=parrotos \${container_user_home}/.local/libexec/dotfiles-distrobox-bootstrap;"
